<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spiriti di Brikeaz — Edizione Oscura</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TEMA DARK FANTASY — COMPLETAMENTE RIVISTO
     ============================================================ */
  :root {
    --gold: #d4a55a;
    --gold-2: #f0d28a;
    --gold-dim: #7a5a2e;
    --gold-glow: rgba(212, 165, 90, 0.35);
    
    --warrior: #d94a2a;
    --thief: #d4a020;
    --archer: #4aad2a;
    --mage: #2a7ad4;
    
    --portal: #8a5ad4;
    --ink: #efeaff;
    --ink-dim: #8a84aa;
    --panel: rgba(16, 10, 30, 0.82);
    --edge: rgba(212, 165, 90, 0.25);
    
    --bg-primary: #0a0616;
    --bg-secondary: #120c22;
    --bg-tertiary: #1a1232;
    
    --font-cinzel: 'Cinzel', serif;
    --font-outfit: 'Outfit', system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-primary);
    font-family: var(--font-outfit);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 30px;
    min-height: 100vh;
    user-select: none;
    position: relative;
    z-index: 0;
    
    /* Tema dinamico per mondi */
    --sky1: #1a0e2e;
    --sky2: #06040e;
    --haze: #2a1a42;
    --hill: #100a1a;
    --mote: #d4a55a;
  }

  /* Sfondi per mondo */
  body[data-theme="0"] {
    --sky1: #0a2a1a;
    --sky2: #040e08;
    --haze: #1a4a2a;
    --hill: #06120a;
    --mote: #6ad48a;
  }
  body[data-theme="1"] {
    --sky1: #1a0a3a;
    --sky2: #08041a;
    --haze: #3a1a6a;
    --hill: #120820;
    --mote: #b08aff;
  }
  body[data-theme="2"] {
    --sky1: #3a0a14;
    --sky2: #180408;
    --haze: #6a2a1a;
    --hill: #20080a;
    --mote: #ff8a4a;
  }

  /* ===== SFONDO ANIMATO ===== */
  #bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    transition: background 1.2s ease;
    background: 
      radial-gradient(130% 90% at 50% -25%, var(--sky1), transparent 62%),
      radial-gradient(120% 70% at 50% 122%, var(--haze), transparent 58%),
      linear-gradient(180deg, var(--sky2), #04020a);
  }

  #bg::before {
    content: '';
    position: absolute;
    left: -12%;
    right: -12%;
    bottom: -8%;
    height: 45%;
    opacity: 0.85;
    background: 
      radial-gradient(58% 100% at 18% 100%, var(--hill), transparent 72%),
      radial-gradient(70% 100% at 62% 100%, var(--hill), transparent 74%),
      radial-gradient(50% 100% at 95% 100%, var(--hill), transparent 70%);
    filter: blur(2px);
  }

  #bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(125% 105% at 50% 42%, transparent 52%, rgba(0,0,0,0.7));
  }

  /* ===== PARTICOLI ===== */
  #motes {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  /* ===== TITOLO ===== */
  h1 {
    font-family: var(--font-cinzel);
    font-weight: 900;
    font-size: clamp(18px, 4.8vw, 28px);
    margin: 0 0 2px;
    text-align: center;
    letter-spacing: 0.12em;
    position: relative;
    background: linear-gradient(180deg, #f0d28a 0%, #d4a55a 30%, #8a6a2e 70%, #d4a55a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(212, 165, 90, 0.2), 0 2px 4px rgba(0,0,0,0.8);
    filter: drop-shadow(0 0 15px rgba(212, 165, 90, 0.15));
  }

  .sub {
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 12px;
    font-weight: 300;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .stage {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  /* ===== SCHERMATE ===== */
  .screen {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .screen.on {
    display: flex;
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== BOTTONI ===== */
  .btn {
    font-family: var(--font-cinzel);
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid rgba(212, 165, 90, 0.4);
    color: #1a1008;
    font-weight: 700;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #e8cd8a, #c9a050 45%, #a88338);
    box-shadow: 
      0 4px 20px rgba(180, 140, 60, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -3px 6px rgba(80, 60, 20, 0.4);
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.15s, box-shadow 0.2s;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.3) 48%, transparent 62%);
    transform: translateX(-120%);
    transition: transform 0.6s;
  }

  .btn:hover::after { transform: translateX(120%); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(180, 140, 60, 0.4); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: default; filter: grayscale(0.5); }

  .btn.ghost {
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: var(--ink);
    border-color: rgba(255,255,255,0.15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    text-shadow: none;
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.08); }

  .btn.sm {
    font-size: 10px;
    padding: 6px 12px;
    border-radius: 6px;
  }

  .btn.danger {
    background: linear-gradient(180deg, #d94a2a, #a82a1a 45%, #7a1a0a);
    border-color: rgba(200, 60, 30, 0.5);
    box-shadow: 0 4px 20px rgba(200, 60, 30, 0.3);
  }

  /* ===== ORO ===== */
  .gold {
    font-family: var(--font-cinzel);
    font-size: 13px;
    color: var(--gold-2);
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 15px rgba(212, 165, 90, 0.3);
  }

  .cur {
    width: 14px;
    height: 14px;
    display: inline-block;
    vertical-align: -2px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
  }
  .gold .cur { width: 16px; height: 16px; }

  /* ===== PANNELLI ===== */
  .panel, .world, .hcard, .partybar, .card2, .slotbox {
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .world {
    border-radius: 16px;
    padding: 14px 14px 16px;
    background: var(--panel);
    border: 1px solid var(--edge);
    box-shadow: 
      0 12px 40px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -2px 8px rgba(0,0,0,0.3);
    position: relative;
  }

  .world::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(212,165,90,0.15), transparent 40%, transparent 60%, rgba(212,165,90,0.08));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .world h3 {
    font-family: var(--font-cinzel);
    margin: 0 0 12px;
    font-size: 14px;
    color: #e8d8b8;
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    letter-spacing: 0.04em;
  }

  /* ===== MAPPA ===== */
  .stages {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .node {
    position: relative;
    border-radius: 12px;
    padding: 12px 4px 10px;
    text-align: center;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.3));
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 4px 16px rgba(0,0,0,0.35);
    transition: transform 0.15s, box-shadow 0.25s, border-color 0.25s;
  }

  .node:not(.locked):hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }

  .node.locked {
    opacity: 0.35;
    cursor: default;
    filter: grayscale(0.8);
  }

  .node.cleared {
    border-color: rgba(74, 220, 138, 0.4);
    box-shadow: inset 0 0 20px rgba(74, 220, 138, 0.08), 0 4px 16px rgba(0,0,0,0.35);
  }

  .node.current {
    border-color: var(--gold);
    box-shadow: 
      0 0 30px rgba(212, 165, 90, 0.3),
      inset 0 0 20px rgba(212, 165, 90, 0.08),
      0 4px 16px rgba(0,0,0,0.35);
    animation: nodePulse 2s ease-in-out infinite;
  }

  @keyframes nodePulse {
    0%, 100% { box-shadow: 0 0 20px rgba(212, 165, 90, 0.2), inset 0 0 20px rgba(212, 165, 90, 0.05); }
    50% { box-shadow: 0 0 40px rgba(212, 165, 90, 0.4), inset 0 0 30px rgba(212, 165, 90, 0.1); }
  }

  .node .em { font-size: 22px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
  .node .lab {
    font-family: var(--font-cinzel);
    font-size: 10px;
    margin-top: 4px;
    color: #d8ccb8;
    letter-spacing: 0.02em;
  }
  .node .st {
    font-size: 8px;
    color: var(--ink-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .node .chk {
    position: absolute;
    top: 4px;
    right: 6px;
    color: #4adc8a;
    font-size: 12px;
    filter: drop-shadow(0 0 6px rgba(74, 220, 138, 0.6));
  }

  /* ===== MEDAGLIONI ===== */
  .medal {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }
  .node .em { display: flex; justify-content: center; }

  /* ===== ROSTER ===== */
  .roster {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .hcard {
    position: relative;
    border-radius: 12px;
    padding: 0;
    background: none;
    border: none;
    box-shadow: none;
    cursor: pointer;
    transition: transform 0.15s;
    overflow: visible;
  }
  .hcard:hover { transform: translateY(-2px); }

  .cframe {
    position: relative;
    border-radius: 12px;
    padding: 8px 8px 10px;
    background: linear-gradient(180deg, #2a1a3a, #120820);
    box-shadow: 
      0 8px 28px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* Cornice con grado */
  .cframe::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    z-index: -1;
    background: linear-gradient(135deg, rgba(212,165,90,0.15), transparent 40%, transparent 60%, rgba(212,165,90,0.08));
    padding: 2px;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  .hcard.sel .cframe::before {
    background: linear-gradient(135deg, var(--gold), rgba(212,165,90,0.3) 40%, rgba(212,165,90,0.2) 60%, var(--gold));
    box-shadow: 0 0 24px rgba(212,165,90,0.25);
  }

  /* Badge elemento */
  .cbadge {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 0 12px currentColor, inset 0 -2px 4px rgba(0,0,0,0.3);
  }
  .cbadge svg { width: 12px; height: 12px; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .cbadge.warrior { background: radial-gradient(circle at 35% 30%, #ff9478, var(--warrior)); color: var(--warrior); }
  .cbadge.thief { background: radial-gradient(circle at 35% 30%, #ffe08a, var(--thief)); color: var(--thief); }
  .cbadge.archer { background: radial-gradient(circle at 35% 30%, #bff08e, var(--archer)); color: var(--archer); }
  .cbadge.mage { background: radial-gradient(circle at 35% 30%, #a9dcff, var(--mage)); color: var(--mage); }

  /* Stelle grado */
  .cstar {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 8px;
    color: var(--gold);
    z-index: 2;
    letter-spacing: -0.5px;
    text-shadow: 0 0 6px rgba(212, 165, 90, 0.4);
  }
  .cstar .cdim { color: #4a3a5a; text-shadow: none; }

  /* Nome */
  .cname {
    text-align: center;
    font-family: var(--font-cinzel);
    font-size: 11px;
    color: #e8dcc8;
    margin: 2px 20px 4px;
    text-shadow: 0 1px 3px #000;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  /* Avatar */
  .cart {
    height: 54px;
    border-radius: 8px;
    background: radial-gradient(circle at 50% 22%, #2a1a3e, #0e0818 75%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-shadow: 
      inset 0 0 20px rgba(0,0,0,0.8),
      inset 0 0 0 1px rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .cart .fig { width: 50px; height: 54px; }

  /* Sottotitolo */
  .csub {
    text-align: center;
    font-size: 8px;
    color: var(--ink-dim);
    margin: 4px 0 5px;
    font-family: var(--font-cinzel);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Barre statistiche */
  .cbar {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 3px;
  }
  .cikn {
    min-width: 30px;
    height: 13px;
    padding: 0 4px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-family: var(--font-cinzel);
    font-weight: 700;
    flex: 0 0 auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 2px rgba(0,0,0,0.4);
  }
  .cikn.hp { background: linear-gradient(180deg, #ff6072, #b8283a); color: #fff; }
  .cikn.atk { background: linear-gradient(180deg, #ffdd8a, #c69434); color: #2a1a00; }

  .cbart {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.6);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.7);
    position: relative;
  }
  .cbart > i {
    display: block;
    height: 100%;
    border-radius: 4px;
  }
  .hpf { background: linear-gradient(90deg, #ff3b52, #ff8a6a); box-shadow: 0 0 10px rgba(255, 60, 80, 0.4); }
  .atf { background: linear-gradient(90deg, #ffcf5e, #e0972c); box-shadow: 0 0 10px rgba(230, 160, 50, 0.4); }

  /* Numero selezione */
  .selnum {
    position: absolute;
    top: -7px;
    left: -7px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff0c8, #d4a55a);
    color: #1a0e00;
    font-family: var(--font-cinzel);
    font-weight: 900;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #f0d28a;
    box-shadow: 0 0 14px rgba(212, 165, 90, 0.6);
    z-index: 3;
  }

  /* Icona ingranaggio */
  .hcard .gear {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 12px;
    opacity: 0.5;
    z-index: 2;
    transition: opacity 0.2s;
  }
  .hcard:hover .gear { opacity: 0.8; }

  /* ===== PARTYBAR ===== */
  .partybar {
    border-radius: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--edge);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .partybar b {
    color: var(--gold-2);
    font-family: var(--font-cinzel);
  }

  /* ===== BATTAGLIA ===== */
  .hud {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(16, 10, 30, 0.92), rgba(8, 4, 16, 0.95));
    border: 1px solid var(--edge);
    box-shadow: 
      inset 0 1px 0 rgba(255,255,255,0.04),
      0 6px 24px rgba(0,0,0,0.5);
  }

  .hud-stage {
    font-family: var(--font-cinzel);
    font-size: 11px;
    color: var(--gold-2);
    letter-spacing: 0.04em;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(212, 165, 90, 0.25);
  }

  .hud-hp {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hud-hp .bar {
    flex: 1;
    height: 12px;
    margin: 0;
    border-radius: 6px;
    background: rgba(0,0,0,0.6);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
  }
  .hud-hp .bar > i {
    display: block;
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
  }
  .hud-hp .bar > i::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent 55%);
  }
  .hud-hp span {
    font-family: var(--font-cinzel);
    font-size: 10px;
    color: #c8bca8;
    min-width: 70px;
    text-align: right;
  }

  .partyfill {
    background: linear-gradient(90deg, #2ad4a0, #2a8ad4);
    box-shadow: 0 0 18px rgba(42, 212, 160, 0.3);
  }

  .hud-pause {
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .hud-pause:hover { background: rgba(255,255,255,0.08); }

  /* ===== ARENA ===== */
  .arena {
    position: relative;
    height: 170px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--edge);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 10px 14px 12px;
    background: 
      radial-gradient(120% 95% at 50% -12%, var(--sky1), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.35)),
      linear-gradient(180deg, var(--haze), var(--sky2));
    box-shadow: 
      inset 0 2px 24px rgba(0,0,0,0.5),
      0 12px 36px rgba(0,0,0,0.5);
    transition: background 1.2s ease;
  }

  .arena-floor {
    position: absolute;
    left: -4%;
    right: -4%;
    bottom: -2%;
    height: 40%;
    background: 
      linear-gradient(180deg, transparent, rgba(0,0,0,0.4)),
      repeating-linear-gradient(74deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 24px);
    border-top: 1px solid rgba(255,255,255,0.04);
    transform: perspective(180px) rotateX(36deg);
    transform-origin: bottom;
    opacity: 0.6;
  }

  .side {
    position: relative;
    z-index: 1;
    display: flex;
  }
  .party { 
    display: grid; 
    grid-template-columns: repeat(2, auto); 
    gap: 4px 12px;
