<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spiriti di Brikeaz</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e8c37a;--gold-2:#f6e0aa;--gold-dim:#8a734a;--warrior:#ec3b2b;--thief:#f5a01e;--archer:#66c22c;--mage:#2ea6ef;--portal:#c07bff;--ink:#efeaff;--ink-dim:#a79fc4;--panel:rgba(24,17,44,.62);--edge:rgba(232,195,122,.28);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:#080512;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 12px 30px;overflow-x:hidden;user-select:none;position:relative;z-index:0;
    --sky1:#2a2050;--sky2:#0b0818;--haze:#3a2a66;--hill:#141024;--mote:#e8c37a;}
  body[data-theme="0"]{--sky1:#14402f;--sky2:#07130f;--haze:#1f6b47;--hill:#0a1a12;--mote:#8affb0;}
  body[data-theme="1"]{--sky1:#2a1548;--sky2:#0d0820;--haze:#5a2f8f;--hill:#160f28;--mote:#c79bff;}
  body[data-theme="2"]{--sky1:#4a1220;--sky2:#160610;--haze:#a3341f;--hill:#240b12;--mote:#ff8a5a;}
  #bg{position:fixed;inset:0;z-index:-2;transition:background 1.1s ease;
    background:radial-gradient(130% 90% at 50% -25%,var(--sky1),transparent 62%),radial-gradient(120% 70% at 50% 122%,var(--haze),transparent 58%),linear-gradient(180deg,var(--sky2),#060410);}
  #bg::before{content:'';position:absolute;left:-12%;right:-12%;bottom:-8%;height:42%;filter:blur(3px);opacity:.92;
    background:radial-gradient(58% 100% at 18% 100%,var(--hill),transparent 72%),radial-gradient(70% 100% at 62% 100%,var(--hill),transparent 74%),radial-gradient(50% 100% at 95% 100%,var(--hill),transparent 70%);}
  #bg::after{content:'';position:absolute;inset:0;background:radial-gradient(125% 105% at 50% 42%,transparent 52%,rgba(0,0,0,.66));}
  #motes{position:fixed;inset:0;z-index:-1;pointer-events:none;}
  h1{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.05em;font-size:clamp(20px,5.4vw,30px);margin:0 0 1px;text-align:center;position:relative;
    background:linear-gradient(100deg,#7a5e2e 0%,#fff3d0 42%,var(--gold) 52%,#fff3d0 62%,#7a5e2e 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 18px rgba(232,195,122,.3);animation:sheen 6s linear infinite;}
  @keyframes sheen{to{background-position:220% 0}}
  .sub{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;font-weight:300;}
  .stage{width:100%;max-width:442px;display:flex;flex-direction:column;gap:11px;position:relative;z-index:1;}
  .screen{display:none;flex-direction:column;gap:11px;} .screen.on{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .btn{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.05em;cursor:pointer;padding:9px 17px;border-radius:12px;border:1px solid #f2dca0;color:#2a1a05;font-weight:700;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#ffe9b8,#e8c37a 45%,#c69a4e);box-shadow:0 5px 16px rgba(180,140,60,.35),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 6px rgba(120,90,30,.4);}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 62%);transform:translateX(-120%);transition:transform .5s;}
  .btn:hover::after{transform:translateX(120%);}
  .btn:active{transform:translateY(1px);} .btn:disabled{opacity:.4;cursor:default;filter:grayscale(.4);}
  .btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));color:var(--ink);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
  .btn.sm{font-size:11px;padding:6px 12px;border-radius:9px;}
  .gold{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-2);display:flex;align-items:center;gap:5px;text-shadow:0 0 10px rgba(232,195,122,.5);}
  .panel,.world,.enemy,.hcard,.partybar,.card2,.slotbox{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .world{border-radius:18px;padding:13px;background:var(--panel);border:1px solid var(--edge);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);position:relative;}
  .world h3{font-family:'Cinzel',serif;margin:0 0 10px;font-size:15px;color:#f4e9c8;display:flex;align-items:center;gap:8px;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .node{position:relative;border-radius:14px;padding:13px 6px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.28));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.35);transition:transform .14s,box-shadow .2s;}
  .node:not(.locked):hover{transform:translateY(-2px);}
  .node.locked{opacity:.42;cursor:default;filter:grayscale(1);} .node.cleared{border-color:rgba(84,224,138,.55);box-shadow:inset 0 0 12px rgba(84,224,138,.18),0 4px 12px rgba(0,0,0,.35);}
  .node.current{border-color:var(--gold);box-shadow:0 0 20px rgba(232,195,122,.5),inset 0 1px 0 rgba(255,255,255,.2);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(232,195,122,.4)}50%{box-shadow:0 0 24px rgba(232,195,122,.8)}}
  .node .em{font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));} .node .lab{font-family:'Cinzel',serif;font-size:11px;margin-top:4px;color:#f4e9c8;} .node .st{font-size:9px;color:var(--ink-dim);margin-top:2px;} .node .chk{position:absolute;top:5px;right:7px;color:#54e08a;font-size:13px;filter:drop-shadow(0 0 4px rgba(84,224,138,.8));}
  .roster{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .hcard{position:relative;border-radius:14px;padding:10px;background:var(--panel);border:1px solid rgba(255,255,255,.1);cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .12s,box-shadow .2s,border-color .2s;}
  .hcard:hover{transform:translateY(-2px);} .hcard.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(232,195,122,.45),inset 0 1px 0 rgba(255,255,255,.12);}
  .hcard .row{display:flex;align-items:center;gap:10px;} .hcard .av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;box-shadow:inset 0 2px 4px rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);}
  .av.warrior{background:radial-gradient(circle at 34% 28%,#ff9478,#ec3b2b 60%,#8f1206);} .av.thief{background:radial-gradient(circle at 34% 28%,#ffd98a,#f5a01e 60%,#9a5c06);} .av.archer{background:radial-gradient(circle at 34% 28%,#c2ef8e,#66c22c 60%,#2f7a10);} .av.mage{background:radial-gradient(circle at 34% 28%,#a9dcff,#2ea6ef 60%,#0a5aa0);}
  .hcard .nm{font-family:'Cinzel',serif;font-size:13px;color:#f4e9c8;line-height:1.1;} .hcard .cls{font-size:9px;color:var(--ink-dim);} .hcard .stars{font-size:10px;color:var(--gold);text-shadow:0 0 6px rgba(232,195,122,.5);}
  .hcard .stat{font-size:11px;color:var(--ink);margin-top:7px;display:flex;justify-content:space-between;} .hcard .lvl{position:absolute;top:7px;right:9px;font-family:'Cinzel',serif;font-size:10px;color:var(--gold-2);}
  .hcard .xp{height:5px;border-radius:3px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);} .hcard .xp>i{display:block;height:100%;background:linear-gradient(90deg,#7ad0ff,#3a8fe8);box-shadow:0 0 8px rgba(90,180,255,.6);}
  .hcard .selnum{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff0c8,#e8a13a);color:#3a2500;font-family:'Cinzel',serif;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid #fff2cf;box-shadow:0 0 10px rgba(255,200,90,.7);}
  .hcard .gear{position:absolute;bottom:7px;right:9px;font-size:14px;opacity:.65;}
  .partybar{border-radius:14px;padding:10px 13px;background:var(--panel);border:1px solid var(--edge);font-size:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);} .partybar b{color:var(--gold-2);font-family:'Cinzel',serif;}
  .wave-label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;color:#dcc7a0;text-align:center;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  .enemies{display:flex;gap:9px;justify-content:center;}
  .enemy{position:relative;flex:1;max-width:142px;border-radius:15px;padding:10px 8px 11px;cursor:pointer;background:var(--panel);border:1px solid var(--edge);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s,border-color .2s,box-shadow .2s;}
  .enemy.target{border-color:var(--gold);box-shadow:0 0 24px rgba(232,195,122,.4),inset 0 1px 0 rgba(255,255,255,.14);transform:translateY(-3px);} .enemy.dead{opacity:.22;filter:grayscale(1);pointer-events:none;}
  .enemy .sprite{width:50px;height:50px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:28px;background:radial-gradient(circle at 36% 30%,#4a2b5e,#150a24 72%);border:2px solid rgba(200,150,255,.35);box-shadow:0 0 20px rgba(176,107,255,.35),inset 0 0 16px rgba(0,0,0,.7);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));}
  .enemy .name{text-align:center;font-family:'Cinzel',serif;font-size:11px;color:#f4e9c8;line-height:1.05;min-height:24px;display:flex;align-items:center;justify-content:center;}
  .enemy .clock{position:absolute;top:-8px;left:-8px;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#fff;background:radial-gradient(circle at 40% 35%,#ffb072,#d8431f);box-shadow:0 0 12px rgba(255,110,60,.7);border:1px solid rgba(255,220,190,.6);}
  .enemy .deb{position:absolute;top:-8px;right:-8px;font-size:11px;background:rgba(150,70,200,.92);border-radius:9px;padding:1px 5px;color:#f0d8ff;border:1px solid rgba(210,160,255,.6);}
  .bar{height:10px;border-radius:7px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.07);position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.7);} .bar>i{display:block;height:100%;border-radius:7px;transition:width .35s cubic-bezier(.2,.8,.2,1);position:relative;}
  .bar>i::after{content:'';position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%);}
  .hpfill{background:linear-gradient(90deg,#ff3b6b,#ff884d);box-shadow:0 0 12px rgba(255,80,90,.6);} .enemy .hptxt{font-size:9px;color:var(--ink-dim);text-align:center;margin-top:3px;}
  .dmgfloat{position:fixed;font-family:'Cinzel',serif;font-weight:900;font-size:24px;pointer-events:none;opacity:0;z-index:60;transform:translateX(-50%);text-shadow:0 2px 5px rgba(0,0,0,.9),0 0 12px currentColor;}
  .board-wrap{position:relative;border-radius:20px;padding:9px;background:linear-gradient(180deg,rgba(30,20,54,.55),rgba(10,6,22,.7));border:1px solid var(--edge);box-shadow:0 16px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 46px rgba(0,0,0,.5);}
  .board{position:relative;display:flex;flex-direction:column;gap:5px;width:92%;margin:0 auto;border-radius:14px;touch-action:none;}
  .cell{position:relative;border-radius:30%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:transform .1s,filter .1s,box-shadow .1s;cursor:pointer;color:#fff;}
  .cell::before{content:'';position:absolute;left:15%;top:8%;width:46%;height:34%;border-radius:40% 40% 50% 50%;pointer-events:none;z-index:3;
    background:radial-gradient(circle at 42% 38%,rgba(255,255,255,.95),rgba(255,255,255,.18) 52%,transparent 72%);filter:blur(.4px);}
  .cell .ic{position:relative;z-index:2;width:60%;height:60%;fill:currentColor;filter:drop-shadow(0 1.4px 1px rgba(0,0,0,.75)) drop-shadow(0 -1px .5px rgba(0,0,0,.4)) drop-shadow(1px 0 .5px rgba(0,0,0,.35)) drop-shadow(-1px 0 .5px rgba(0,0,0,.35));opacity:1;}
  .cell.pop{animation:pop .32s ease forwards;} .cell.link{transform:scale(1.16);z-index:6;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 22px currentColor,0 6px 12px rgba(0,0,0,.5);filter:brightness(1.22) saturate(1.15);}
  .cell.special{box-shadow:0 0 0 2px rgba(255,225,168,.5),0 0 14px rgba(255,200,120,.45),inset 0 -4px 8px rgba(0,0,0,.5);} .cell.super{box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold),inset 0 -4px 8px rgba(0,0,0,.5);}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3);filter:brightness(2.2)}100%{transform:scale(0);opacity:0}}
  .c-warrior{background:radial-gradient(circle at 50% 40%,#ff9478,#ec3b2b 52%,#8f1206 100%);box-shadow:inset 0 -6px 10px rgba(80,4,0,.6),inset 0 3px 5px rgba(255,255,255,.4),0 4px 9px rgba(0,0,0,.45),0 0 16px rgba(236,59,43,.4);color:#fff;}
  .c-thief{background:radial-gradient(circle at 50% 40%,#ffd98a,#f5a01e 52%,#9a5c06 100%);box-shadow:inset 0 -6px 10px rgba(80,48,0,.55),inset 0 3px 5px rgba(255,255,255,.55),0 4px 9px rgba(0,0,0,.45),0 0 16px rgba(245,160,30,.4);color:#fff;}
  .c-archer{background:radial-gradient(circle at 50% 40%,#c2ef8e,#66c22c 52%,#2f7a10 100%);box-shadow:inset 0 -6px 10px rgba(0,50,10,.55),inset 0 3px 5px rgba(255,255,255,.45),0 4px 9px rgba(0,0,0,.45),0 0 16px rgba(102,194,44,.4);color:#fff;}
  .c-mage{background:radial-gradient(circle at 50% 40%,#a9dcff,#2ea6ef 52%,#0a5aa0 100%);box-shadow:inset 0 -6px 10px rgba(0,26,60,.55),inset 0 3px 5px rgba(255,255,255,.5),0 4px 9px rgba(0,0,0,.45),0 0 16px rgba(46,166,239,.4);color:#fff;}
  .c-portal{background:conic-gradient(from 0deg,#ff5747,#ffc42e,#54e08a,#43b0ff,#c07bff,#ff5747);box-shadow:inset 0 -4px 8px rgba(0,0,0,.4),0 4px 9px rgba(0,0,0,.45),0 0 18px rgba(192,123,255,.6);color:#fff;}
  .c-portal .ic{animation:spin 4s linear infinite;} @keyframes spin{to{transform:rotate(360deg)}}
  .c-stone{background:radial-gradient(circle at 40% 32%,#a7a2b8,#6a6480 46%,#2c2740 100%);border-radius:26%;box-shadow:inset 0 3px 5px rgba(255,255,255,.25),inset 0 -5px 9px rgba(0,0,0,.55),0 4px 9px rgba(0,0,0,.45);color:#d9d2e6;}
  .c-stone::before{opacity:.5;}
  .c-special{background:radial-gradient(circle at 48% 36%,#6b6486,#332c4e 50%,#120c22 100%);box-shadow:inset 0 -6px 10px rgba(0,0,0,.6),inset 0 3px 5px rgba(255,255,255,.35),0 4px 9px rgba(0,0,0,.5);color:#ffe1a8;}
  .c-special .ic{filter:drop-shadow(0 0 5px rgba(255,200,120,.85));opacity:1;}
  #linkLayer{position:absolute;inset:0;pointer-events:none;z-index:4;}
  #fxLayer{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:visible;}
  .fx{position:absolute;transform:translate(-50%,-50%);will-change:transform,opacity;}
  .fx-flash{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff,#ffcf6a 45%,transparent 72%);animation:fxflash .42s ease-out forwards;}
  @keyframes fxflash{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}
  .fx-ring{width:28px;height:28px;border-radius:50%;border:3px solid #ffb060;box-shadow:0 0 16px #ffb060;animation:fxring .5s ease-out forwards;}
  .fx-ring2{width:28px;height:28px;border-radius:50%;border:3px solid #ff7a3c;animation:fxring .64s ease-out .07s forwards;}
  @keyframes fxring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.4)}}
  .fx-slash{width:300px;height:7px;border-radius:5px;background:linear-gradient(90deg,transparent,#eaf6ff,#fff,transparent);box-shadow:0 0 16px #bfe3ff;transform:translate(-50%,-50%) rotate(var(--rot));animation:fxslash .4s ease-out forwards;}
  @keyframes fxslash{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scaleX(.15)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scaleX(1.18)}}
  .fx-arrow{font-size:18px;color:#eaffea;text-shadow:0 0 9px #6bff8a;animation:fxarrow .54s ease-out forwards;}
  @keyframes fxarrow{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot))}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot))}}
  .fx-heal{font-size:24px;color:#8affb0;font-weight:900;text-shadow:0 0 12px #3ec96a;animation:fxheal .78s ease-out forwards;} .fx-heal::before{content:'\FF0B';}
  @keyframes fxheal{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-175%) scale(1.15)}}
  .fx-heal-ring{width:28px;height:28px;border-radius:50%;border:3px solid #6bffa0;box-shadow:0 0 16px #6bffa0;animation:fxring .6s ease-out forwards;}
  .status{display:flex;align-items:center;gap:10px;} .status .lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;color:var(--gold-dim);white-space:nowrap;} .partyfill{background:linear-gradient(90deg,#43e0a0,#39c0ff);box-shadow:0 0 14px rgba(60,200,180,.6);}
  .team{display:flex;gap:8px;} .team .hero{flex:1;}
  .hero{position:relative;border-radius:14px;padding:7px 3px 8px;text-align:center;background:var(--panel);border:1px solid rgba(255,255,255,.09);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .12s,box-shadow .2s;cursor:default;}
  .hero.ready{cursor:pointer;border-color:var(--gold);box-shadow:0 0 18px rgba(232,195,122,.55);animation:pulse 1.2s ease-in-out infinite;}
  .hero .face{font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));} .hero .hn{font-size:8.5px;color:var(--ink-dim);margin-top:2px;} .hero .atk{font-size:8.5px;font-family:'Cinzel',serif;color:var(--gold-2);margin-top:1px;}
  .hero .sgauge{height:5px;border-radius:3px;background:rgba(0,0,0,.5);margin-top:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);} .hero .sgauge>i{display:block;height:100%;background:linear-gradient(90deg,#ffe08a,#e8a13a);box-shadow:0 0 8px rgba(232,161,58,.6);transition:width .3s;}
  .hero .sbadge{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:12px;color:#3a2500;background:radial-gradient(circle at 40% 35%,#fff0c8,#e8a13a);border:1px solid #fff2cf;box-shadow:0 0 14px rgba(255,200,90,.85);}
  .hero.flash{transform:translateY(-7px) scale(1.09);box-shadow:0 0 22px currentColor;}
  .hero.warrior{color:var(--warrior)}.hero.thief{color:var(--thief)}.hero.archer{color:var(--archer)}.hero.mage{color:var(--mage)}
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:9.5px;color:var(--ink-dim);line-height:1.35;} .legend b{color:var(--ink);}
  .combo{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-family:'Cinzel',serif;font-weight:900;font-size:46px;pointer-events:none;opacity:0;z-index:40;text-align:center;

/* ===== persistenza: window.storage → localStorage → memoria ===== */
const Store={mem:{},
  async get(k){try{if(typeof window!=='undefined'&&window.storage&&window.storage.get){const r=await window.storage.get(k,false);return r&&r.value?JSON.parse(r.value):null;}}catch(e){}
    try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){} return this.mem[k]||null;},
  async set(k,val){this.mem[k]=val;const s=JSON.stringify(val);try{if(typeof window!=='undefined'&&window.storage&&window.storage.set){await window.storage.set(k,s,false);return;}}catch(e){}try{localStorage.setItem(k,s);}catch(e){}},
  async del(k){delete this.mem[k];try{if(window.storage&&window.storage.delete){await window.storage.delete(k,false);return;}}catch(e){}try{localStorage.removeItem(k);}catch(e){}}};

/* ===== DATA dai file APK ===== */

function renderHero(){const h=HEROES.find(x=>x.id===heroOpen);const col=COLORS[h.color];const need=expToNext(h);
  const wEq=h.equip.weapon?EQUIP[h.equip.weapon]:null,aEq=h.equip.acc?EQUIP[h.equip.acc]:null;
  const wOpts=Object.entries(EQUIP).filter(([k,e])=>e.slot==='weapon'&&e.color===h.color&&(owned[k]>0)||(wEq&&h.equip.weapon===k&&false));
  const ownedW=Object.entries(EQUIP).filter(([k,e])=>e.slot==='weapon'&&e.color===h.color&&owned[k]>0);
  const ownedA=Object.entries(EQUIP).filter(([k,e])=>e.slot==='acc'&&owned[k]>0);

    <div class="statline"><span>❤ Salute</span><b>${heroHp(h)}${equipHp(h)?` <span style="color:#7ce">+${equipHp(h)}</span>`:''} = ${effHp(h)}</b></div>

  ownedW.forEach(([k,e])=>{if(h.equip.weapon===k)return;html+=`<div class="opt"><span>${e.name} <span class="st">+${e.atk} ATK ×${owned[k]}</span></span><button class="btn sm" data-eq="${k}" data-slot="weapon">equipaggia</button></div>`;});
  if(ownedW.length===0&&!wEq)html+=`<div class="opt"><span class="st">Nessun'arma in inventario — compra in Bottega</span></div>`;
  html+=`</div>`;
  // acc slot
  html+=`<div class="slotbox"><div class="h">💍 ACCESSORIO</div>`;
  html+=`<div class="opt"><span>${aEq?aEq.name+` <span class="st">+${aEq.hp} HP</span>`:'<span class="st">vuoto</span>'}</span>${aEq?'<button class="btn ghost sm" data-uneq="acc">rimuovi</button>':''}</div>`;
  ownedA.forEach(([k,e])=>{if(h.equip.acc===k)return;html+=`<div class="opt"><span>${e.name} <span class="st">+${e.hp} HP ×${owned[k]}</span></span><button class="btn sm" data-eq="${k}" data-slot="acc">equipaggia</button></div>`;});
  if(ownedA.length===0&&!aEq)html+=`<div class="opt"><span class="st">Nessun accessorio — compra in Bottega</span></div>`;
  html+=`</div><div class="statline" style="margin-top:8px"><span>${COIN} Oro</span><b>${gold}</b></div>`;
  $('modalBody').innerHTML=html;
  const pot=$('btnPotenzia');if(pot)pot.onclick=()=>potenzia(h);
  const evo=$('btnEvolvi');if(evo)evo.onclick=()=>evolvi(h);

function equipItem(h,slot,key){const cur=h.equip[slot];if(cur){owned[cur]=(owned[cur]||0)+1;}owned[key]--;if(owned[key]<=0)delete owned[key];h.equip[slot]=key;saveState();renderHero();}
function unequip(h,slot){const cur=h.equip[slot];if(cur){owned[cur]=(owned[cur]||0)+1;h.equip[slot]=null;}saveState();renderHero();}
function potenzia(h){if(h.level>=MAXLV||gold<200)return;gold-=200;h.exp+=60;while(h.level<MAXLV&&h.exp>=expToNext(h)){h.exp-=expToNext(h);h.level++;}saveState();renderHUD();renderHero();}

function beginBattle(){teamHeroes=selected.map(id=>{const h=HEROES.find(x=>x.id===id);return {ref:h,color:h.color,face:h.face,name:h.name,atk:effAtk(h),hp:effHp(h),skill:COLORS[h.color].skill};});
  colorAtk=[0,0,0,0];teamHeroes.forEach(t=>colorAtk[t.color]+=t.atk);partyMax=teamHeroes.reduce((a,t)=>a+t.hp,0);partyHp=partyMax;
  charge=teamHeroes.map(()=>0);ready=teamHeroes.map(()=>false);dodge=0;enemyAtkDebuff=0;
  const {w,s}=pendingStage;battle={w,s,...makeStage(w,s),subIndex:0};

function genCell(){const r=Math.random();if(r<0.03)return{t:'portal'};if(battle&&(battle.s>0||battle.w>0)&&r<0.06)return{t:'stone'};if(r<0.16){return{t:'special',kind:['sword','bomb','bow','potion'][Math.floor(Math.random()*4)]};}return{t:'class',el:rnd4()};}

function addCharge(count){teamHeroes.forEach((t,i)=>{const n=count[t.color];if(n>0&&!ready[i]){charge[i]+=n;if(charge[i]>=t.skill.max){charge[i]=t.skill.max;ready[i]=true;}}});}

function shade(hex,amt){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function heroFeat(ck,c,dark,ol){

  teamHeroes.forEach(t=>{const h=t.ref;if(h.level>=MAXLV)return;h.exp+=battle.reward;while(h.level<MAXLV&&h.exp>=expToNext(h)){h.exp-=expToNext(h);h.level++;lvups.push(`${h.name} → Lv ${h.level}`);}});
  saveState();const done=cleared.size>=GLOBAL;
  showOverlay(done?'Brikeaz è salva':'Stage completato!',`+${battle.reward} EXP a ogni eroe · +${battle.gold} ${COIN}`,lvups,done?'Rigioca':'Alla mappa',()=>{hideOverlay();showScreen('map');renderMap();});}

function showCombo(t){const c=$('comboText');c.innerHTML=t.replace(/\n/g,'<br>');c.classList.remove('show');void c.offsetWidth;c.classList.add('show');}
function showOverlay(t,x,lvups,btn,cb){$('ovTitle').textContent=t;$('ovText').textContent=x;$('ovLvups').innerHTML=(lvups&&lvups.length)?('⭐ '+lvups.join('<br>⭐ ')):'';const b=$('ovBtn');b.textContent=btn;b.onclick=cb;$('overlay').classList.add('show');}
function hideOverlay(){$('overlay').classList.remove('show');}

boardEl.addEventListener('pointerdown',e=>{if(!playing||busy)return;const p=cellAt(e.clientX,e.clientY);if(p){e.preventDefault();startChain(p);}});
window.addEventListener('pointermove',e=>{if(!dragging)return;const p=cellAt(e.clientX,e.clientY);if(p)extendChain(p);});
window.addEventListener('pointerup',()=>{if(dragging)endChain();});window.addEventListener('pointercancel',()=>{if(dragging)endChain();});window.addEventListener('resize',()=>{if(dragging)drawLinks();});

$('toTeamBtn').onclick=()=>{let w=Math.floor(unlocked/STAGES_PER_WORLD),s=unlocked%STAGES_PER_WORLD;if(w>=WORLDS.length){w=WORLDS.length-1;s=STAGES_PER_WORLD-1;}pendingStage={w,s};showScreen('team');renderRoster();};
$('teamBack').onclick=()=>{showScreen('map');renderMap();};
$('pauseBtn').onclick=()=>{playing=false;showScreen('map');renderMap();};
$('shopBtn').onclick=openShop;
$('modalClose').onclick=()=>{$('modal').classList.remove('show');renderRoster();};
$('resetBtn').onclick=()=>{if(confirm('Azzerare tutti i progressi salvati?')){Store.del('ss_save');location.reload();}};

/* init */

function setTheme(k){document.body.dataset.theme=k;}
function initMotes(){const cv=document.getElementById('motes');if(!cv)return;const ctx=cv.getContext('2d');let W,H;const P=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
  for(let i=0;i<48;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.6,s:Math.random()*.35+.12,a:Math.random()*.5+.18,d:Math.random()*6.28});
  (function tick(){ctx.clearRect(0,0,W,H);const col=(getComputedStyle(document.body).getPropertyValue('--mote')||'#e8c37a').trim();ctx.shadowColor=col;
    P.forEach(p=>{p.y-=p.s;p.x+=Math.sin(p.d+p.y*0.01)*0.18;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}ctx.globalAlpha=p.a;ctx.shadowBlur=9;ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(tick);})();}

(async()=>{await loadState();initMotes();renderHUD();renderMap();showScreen('map');})();
</script>
